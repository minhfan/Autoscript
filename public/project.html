<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoscript TCP — Projects</title>
    <meta name="description" content="Manage your Autoscript video logging projects. Create, open, and sync Google Sheets.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
/* ============================================================
   AUTOSCRIPT TCP — Project Page Styles
   Design: design-taste-frontend-v1
   Palette: Zinc/Slate base + Emerald accent
   Font: Outfit + JetBrains Mono
   ============================================================ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
    --bg-deep: #09090b;
    --bg-surface: #18181b;
    --bg-card: #141416;
    --bg-card-hover: #1a1a1e;
    --bg-input: #27272a;
    --bg-input-focus: #3f3f46;
    --border: #27272a;
    --border-bright: #3f3f46;
    --border-subtle: rgba(255,255,255,0.06);
    --text-main: #fafafa;
    --text-sub: #a1a1aa;
    --text-muted: #71717a;
    --text-dim: #52525b;
    --accent: #10b981;
    --accent-dim: rgba(16, 185, 129, 0.12);
    --accent-glow: rgba(16, 185, 129, 0.2);
    --danger: #ef4444;
    --danger-dim: rgba(239, 68, 68, 0.1);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 20px;
    --r-xl: 24px;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.15);
    --shadow-card-hover: 0 4px 12px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.2);
    --transition-base: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    --font-sans: 'Outfit', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

html { height: 100%; }

body {
    font-family: var(--font-sans);
    background: var(--bg-deep);
    color: var(--text-main);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ── Top Navigation Bar ──────────────────────────────────── */
.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(9, 9, 11, 0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
}

.topbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 32px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.topbar-logo {
    display: flex;
    align-items: flex-start;
    text-decoration: none;
    color: var(--text-main);
}

.logo-badge {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid rgba(16, 185, 129, 0.2);
}

.logo-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text-main);
}

.logo-title span {
    color: var(--accent);
}

.logo-title em {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    line-height: 1;
    font-style: normal;
}

.topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.topbar-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-input);
    border: 1px solid var(--border-bright);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    overflow: hidden;
    flex-shrink: 0;
}

.topbar-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.topbar-email {
    font-size: 12.5px;
    color: var(--text-sub);
    font-weight: 500;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.topbar-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition-base);
}

.topbar-btn:hover {
    background: var(--bg-input);
    border-color: var(--text-sub);
    color: var(--text-main);
}

.topbar-btn-logout:hover {
    background: var(--danger-dim);
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
}

/* ── Main Content ────────────────────────────────────────── */
.main-content {
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 32px 80px;
}

/* ── Page Header ─────────────────────────────────────────── */
.page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 36px;
    animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.page-header-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex: 1;
    min-width: 0;
    gap: 12px;
    flex-wrap: nowrap;
}

.page-header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text-main);
    line-height: 1;
}

.page-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
}

.project-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
    min-width: 0;
    margin-left: auto;
}

.toolbar-search {
    width: 240px;
    min-width: 0;
    flex: 0 1 240px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    min-height: 46px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    transition: var(--transition-base);
}

.toolbar-search:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    background: rgba(255,255,255,0.03);
}

.toolbar-search-icon {
    color: var(--text-dim);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.toolbar-search input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-main);
    font-family: var(--font-sans);
    font-size: 13px;
}

.toolbar-search input::placeholder {
    color: var(--text-dim);
}

.toolbar-search input::-webkit-search-cancel-button {
    appearance: none;
}

.toolbar-sort {
    position: relative;
    width: 138px;
    flex: 0 0 138px;
}

.toolbar-sort select {
    width: 100%;
    min-height: 46px;
    padding: 0 38px 0 14px;
    background: #111113;
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: var(--transition-base);
    appearance: none;
    color-scheme: dark;
}

.toolbar-sort select:hover {
    border-color: var(--border-bright);
    color: var(--text-main);
}

.toolbar-sort select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
    color: var(--text-main);
}

.toolbar-sort select option {
    background: #111113;
    color: var(--text-main);
}

.toolbar-sort-icon {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.view-toggle {
    display: inline-flex;
    align-items: center;
    padding: 4px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
}

.view-toggle-btn {
    width: 38px;
    height: 38px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: calc(var(--r-md) - 4px);
    color: var(--text-dim);
    cursor: pointer;
    transition: var(--transition-base);
}

.view-toggle-btn:hover {
    color: var(--text-sub);
    background: rgba(255,255,255,0.04);
}

.view-toggle-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
}

.btn-manage-users,
.btn-new-project {
    flex-shrink: 0;
}

.btn-new-project {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: var(--transition-base);
    white-space: nowrap;
}

.btn-new-project:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px var(--accent-glow);
}

.btn-new-project:active {
    transform: translateY(0) scale(0.98);
}

/* ── Project Grid ────────────────────────────────────────── */
.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

.project-grid.is-list {
    grid-template-columns: 1fr;
    gap: 16px;
}

/* ── Project Card ────────────────────────────────────────── */
.project-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    padding: 24px;
    transition: var(--transition-base);
    position: relative;
    animation: fadeScaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    display: flex;
    flex-direction: column;
}

.project-card:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-bright);
    box-shadow: var(--shadow-card-hover);
    transform: translateY(-2px);
}

.project-grid.is-list .project-card {
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.95fr) minmax(168px, auto);
    grid-template-areas: "summary info footer";
    column-gap: 20px;
    row-gap: 0;
    align-items: center;
    padding: 22px 24px;
    min-height: 116px;
}

.project-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 20px;
}

.project-grid.is-list .project-card-header {
    grid-area: summary;
    margin-bottom: 0;
    width: 100%;
    align-items: center;
    position: relative;
    z-index: 1;
}

.project-card-icon {
    width: 40px;
    height: 40px;
    background: var(--accent-dim);
    border: 1px solid rgba(16, 185, 129, 0.15);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    flex-shrink: 0;
}

.project-card-actions {
    display: flex;
    gap: 4px;
}

.card-action-btn {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    color: var(--text-dim);
    cursor: pointer;
    transition: var(--transition-base);
}

.card-action-btn:hover {
    background: var(--bg-input);
    border-color: var(--border);
    color: var(--text-sub);
}

.card-action-btn.danger:hover {
    background: var(--danger-dim);
    border-color: rgba(239, 68, 68, 0.25);
    color: #fca5a5;
}

.project-card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 16px;
    line-height: 1.3;
    word-break: break-word;
}

.project-grid.is-list .project-card-name {
    grid-area: summary;
    margin-bottom: 0;
    align-self: center;
    padding: 0 88px 0 56px;
    line-height: 1.35;
    pointer-events: none;
}

/* ── Card Info Rows (Speaker / Source) ────────────────────── */
.project-card-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
    flex: 1;
}

.project-grid.is-list .project-card-info {
    grid-area: info;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 0;
    min-width: 0;
    align-self: center;
}

.project-grid.is-list .info-row {
    min-height: 100%;
}

.info-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-sm);
    transition: var(--transition-base);
    cursor: pointer;
    position: relative;
}

.info-row:hover {
    background: rgba(255,255,255,0.04);
    border-color: var(--border);
}

.info-row:hover .info-edit-icon {
    opacity: 1;
}

.info-label {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
    min-width: 58px;
    padding-top: 1px;
}

.info-value {
    font-size: 12.5px;
    color: var(--text-sub);
    line-height: 1.5;
    word-break: break-word;
    flex: 1;
}

.info-value.empty {
    color: var(--text-dim);
    font-style: italic;
}

.info-edit-icon {
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
    margin-top: 1px;
}

/* ── Card Footer ─────────────────────────────────────────── */
.project-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
}

.project-grid.is-list .project-card-footer {
    grid-area: footer;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    min-width: 168px;
    height: auto;
    padding-top: 0;
    padding-left: 20px;
    border-top: none;
    border-left: 1px solid var(--border-subtle);
    align-self: stretch;
}

.project-card-date {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono);
}

.btn-open-project {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    background: var(--accent-dim);
    color: var(--accent);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: var(--transition-base);
    text-decoration: none;
}

.btn-open-project:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
}

.btn-open-project:active {
    transform: scale(0.97);
}

/* ── Sheet Link ──────────────────────────────────────────── */
.project-sheet-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.2s;
    margin-bottom: 16px;
}

.project-sheet-link:hover {
    color: var(--accent);
}

/* ── Empty State ─────────────────────────────────────────── */
.empty-state {
    text-align: center;
    padding: 80px 20px;
    animation: fadeSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.empty-icon {
    color: var(--text-dim);
    margin-bottom: 24px;
    opacity: 0.5;
}

.empty-state h3 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 10px;
}

.empty-state p {
    font-size: 13.5px;
    color: var(--text-muted);
    max-width: 400px;
    margin: 0 auto 28px;
    line-height: 1.6;
}

.btn-empty {
    margin: 0 auto;
}

/* ── Loading Skeleton ────────────────────────────────────── */
.skeleton-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

.skeleton-card {
    height: 240px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-xl);
    overflow: hidden;
    position: relative;
}

.skeleton-shimmer {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.03) 50%, transparent 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
}

/* ── Modal ────────────────────────────────────────────────── */
.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
}

.modal-card {
    width: 100%;
    max-width: 440px;
    background: var(--bg-surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--r-xl);
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    animation: modalSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.modal-card-sm {
    max-width: 380px;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
}

.modal-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
}

.modal-close {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: var(--r-sm);
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition-base);
}

.modal-close:hover {
    background: var(--bg-input);
    color: var(--text-main);
}

.modal-body {
    padding: 24px;
}

.modal-input-group {
    margin-bottom: 18px;
}

.modal-input-group:last-child {
    margin-bottom: 0;
}

.modal-input-group label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 8px;
}

.input-optional {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 10px;
}

.modal-input-group input {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
    transition: var(--transition-base);
}

.modal-input-group input::placeholder {
    color: var(--text-dim);
}

.modal-input-group input:focus {
    border-color: var(--accent);
    background: var(--bg-input-focus);
    box-shadow: 0 0 0 3px var(--accent-dim);
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
}

.btn-modal-cancel {
    padding: 9px 18px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--text-sub);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition-base);
}

.btn-modal-cancel:hover {
    background: var(--bg-input);
}

.btn-modal-create {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: var(--transition-base);
}

.btn-modal-create:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--accent-glow);
}

.btn-modal-create:active {
    transform: translateY(0) scale(0.98);
}

.btn-modal-create:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

.modal-status {
    padding: 12px 24px;
    font-size: 12px;
    color: var(--text-sub);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
}

.modal-status.error {
    color: #fca5a5;
    background: var(--danger-dim);
}

.modal-status.success {
    color: var(--accent);
    background: var(--accent-dim);
}

.modal-status .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border-bright);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
}

/* ── Animations ──────────────────────────────────────────── */
@keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeScaleIn {
    from { opacity: 0; transform: scale(0.96) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes modalSlideUp {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ── Responsive ──────────────────────────────────────────── */
@media (max-width: 768px) {
    .topbar-inner {
        padding: 0 16px;
    }

    .topbar-email {
        display: none;
    }

    .topbar-btn span {
        display: none;
    }

    .main-content {
        padding: 24px 16px 60px;

    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }

    .page-header-actions {
        width: 100%;
        justify-content: stretch;
        flex-wrap: wrap;
    }

    .project-toolbar {
        width: 100%;
        margin-left: 0;
        flex-wrap: wrap;
    }

    .toolbar-search {
        width: 100%;
        flex-basis: 100%;
    }

    .toolbar-sort {
        width: auto;
        flex: 1 1 160px;
    }

    .btn-new-project {
        width: 100%;
        justify-content: center;
    }

    .project-grid {
        grid-template-columns: 1fr;
    }

    .skeleton-grid {
        grid-template-columns: 1fr;
    }

    .project-card {
        padding: 20px;
    }

    .project-grid.is-list .project-card {
        grid-template-columns: 1fr;
        grid-template-areas:
            "summary"
            "info"
            "footer";
        row-gap: 16px;
        min-height: 0;
    }

    .project-grid.is-list .project-card-header {
        align-items: flex-start;
    }

        padding: 52px 0 0;
    }

        align-items: center;

}

@media (max-width: 480px) {

        font-size: 22px;

// ============================================================
//  AUTOSCRIPT TCP — Project Page Logic
//  Handles project CRUD via Worker API, profile-based token auth,
//  and Admin-only User Management panel.
// ============================================================

(function () {
    'use strict';

    // ── Session Checking & Auth ─────────────────────────────
    const sessionToken = localStorage.getItem('autoscript_session_token');
    const sessionUser = localStorage.getItem('autoscript_session_username');

    function requireAuth() {
        if (!sessionToken || !sessionUser) {
            localStorage.removeItem('autoscript_session_token');
            localStorage.removeItem('autoscript_session_username');
            window.location.href = 'login.html';
            return false;
        }
        return true;
    }

    if (!requireAuth()) return;

    // Helper for API headers
    function getAuthHeaders() {
        return {
            'Authorization': `Bearer ${sessionToken}`,
            'Content-Type': 'application/json'
        };
    }

    // ── State ────────────────────────────────────────────────
    let projects = [];
    let editingProject = null; // { index, field } for inline edit modal
    let projectSearchQuery = '';
    let projectSortMode = localStorage.getItem('autoscript_project_sort_mode') === 'oldest' ? 'oldest' : 'newest';
    let projectViewMode = localStorage.getItem('autoscript_project_view_mode') === 'list' ? 'list' : 'grid';

    // ── DOM References ───────────────────────────────────────
    // Views
    const projectsView = document.getElementById('projectsView');
    const projectGrid = document.getElementById('projectGrid');
    const emptyState = document.getElementById('emptyState');
    const emptyStateTitle = document.getElementById('emptyStateTitle');
    const emptyStateText = document.getElementById('emptyStateText');
    const loadingState = document.getElementById('loadingState');
    const pageTitle = document.getElementById('pageTitle');
    const pageSubtitle = document.getElementById('pageSubtitle');
    const projectToolbar = document.getElementById('projectToolbar');
    const projectSearchInput = document.getElementById('projectSearchInput');
    const projectSortSelect = document.getElementById('projectSortSelect');
    const btnGridView = document.getElementById('btnGridView');
    const btnListView = document.getElementById('btnListView');

    // Topbar
    const topbarEmail = document.getElementById('topbarEmail');
    const topbarAvatar = document.getElementById('topbarAvatar');
    const btnSettings = document.getElementById('btnSettings');
    const btnLogout = document.getElementById('btnLogout');

    // Project Actions
    const btnNewProject = document.getElementById('btnNewProject');
    const btnNewProjectEmpty = document.getElementById('btnNewProjectEmpty');

    // Project Modal references
    const newProjectModal = document.getElementById('newProjectModal');
    const modalClose = document.getElementById('modalClose');
    const modalCancel = document.getElementById('modalCancel');
    const modalCreate = document.getElementById('modalCreate');
    const modalProjectName = document.getElementById('modalProjectName');
    const modalSpeaker = document.getElementById('modalSpeaker');
    const modalSource = document.getElementById('modalSource');
    const modalStatus = document.getElementById('modalStatus');

    // Edit field modal
    const editFieldModal = document.getElementById('editFieldModal');
    const editFieldClose = document.getElementById('editFieldClose');
    const editFieldCancel = document.getElementById('editFieldCancel');
    const editFieldSave = document.getElementById('editFieldSave');
    const editFieldInput = document.getElementById('editFieldInput');
    const editFieldTitle = document.getElementById('editFieldTitle');
    const editFieldLabel = document.getElementById('editFieldLabel');

    // ── Helpers ──────────────────────────────────────────────
    function formatDate(isoString) {
        try {
            const d = new Date(isoString);
            return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
        } catch (e) {
            return '—';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function normalizeSearchValue(value) {
        return String(value || '').trim().toLowerCase();
    }

    function getFilteredProjects() {
        const query = normalizeSearchValue(projectSearchQuery);

        if (!query) {
            return projects;
        }

        return projects.filter((project) => {
            const searchable = [
                project.name,
                project.speaker,
                project.source
            ].map(normalizeSearchValue);

            return searchable.some((value) => value.includes(query));
        });
    }

    function getProjectTimestamp(project) {
        const parsed = Date.parse(project && project.createdAt ? project.createdAt : '');
        return Number.isNaN(parsed) ? 0 : parsed;
    }

    function getVisibleProjects() {
        const filteredProjects = getFilteredProjects();

        return filteredProjects.slice().sort((projectA, projectB) => {
            const diff = getProjectTimestamp(projectB) - getProjectTimestamp(projectA);
            return projectSortMode === 'oldest' ? -diff : diff;
        });
    }

    function syncProjectToolbar() {
        if (projectToolbar) {
            projectToolbar.style.display = 'flex';
        }

        if (projectSortSelect) {
            projectSortSelect.value = projectSortMode;
        }

        if (projectGrid) {
            projectGrid.classList.toggle('is-list', projectViewMode === 'list');
        }

        if (btnGridView) {
            const isActive = projectViewMode === 'grid';
            btnGridView.classList.toggle('active', isActive);
            btnGridView.setAttribute('aria-pressed', String(isActive));
        }

        if (btnListView) {
            const isActive = projectViewMode === 'list';
            btnListView.classList.toggle('active', isActive);
            btnListView.setAttribute('aria-pressed', String(isActive));
        }
    }

    function setProjectViewMode(nextMode) {
        projectViewMode = nextMode === 'list' ? 'list' : 'grid';
        localStorage.setItem('autoscript_project_view_mode', projectViewMode);
        syncProjectToolbar();
        renderProjects();
    }

    function setProjectSortMode(nextMode) {
        projectSortMode = nextMode === 'oldest' ? 'oldest' : 'newest';
        localStorage.setItem('autoscript_project_sort_mode', projectSortMode);
        syncProjectToolbar();
        renderProjects();
    }

    // ── Render User Info ─────────────────────────────────────
    function renderUserInfo() {
        if (topbarEmail) topbarEmail.textContent = sessionUser;
        if (topbarAvatar) {
            topbarAvatar.innerHTML = `<span class="profile-initial" style="font-weight: 700; color: #fff; font-size: 14px;">${sessionUser.charAt(0).toUpperCase()}</span>`;
            // Set dynamic background color based on length
            const colors = ['#10b981', '#6366f1', '#ec4899', '#f59e0b', '#f43f5e'];
            const colorIndex = sessionUser.toLowerCase() === 'admin' ? 0 : sessionUser.toLowerCase() === 'nguyên' ? 1 : sessionUser.length % colors.length;
            topbarAvatar.style.background = colors[colorIndex];
        }

        // Chỉ Admin mới thấy Setting
        if (btnSettings && sessionUser.toLowerCase() === 'admin') {
            btnSettings.style.display = 'inline-flex';
        }
    }

    // ── Projects CRUD Logic ──────────────────────────────────
    async function loadProjects() {
        if (loadingState) loadingState.style.display = 'block';
        if (projectsView) projectsView.style.display = 'none';

        try {
            const res = await fetch('/api/projects', {
                headers: getAuthHeaders()
            });
            if (res.status === 401) {
                handleLogout();
                return;
            }
            if (!res.ok) throw new Error('Failed to fetch project list');
            projects = await res.json();
            renderProjects();
        } catch (e) {
            console.error('Load projects error:', e);
            if (projectGrid) {
                projectGrid.innerHTML = `<div style="color: var(--danger); text-align: center; grid-column: 1/-1; padding: 40px;">Error: ${e.message}</div>`;
            }
        } finally {
            if (loadingState) loadingState.style.display = 'none';
            if (projectsView) projectsView.style.display = 'block';
        }
    }

    function renderProjects() {
        if (!projectGrid) return;
        syncProjectToolbar();

        const visibleProjects = getVisibleProjects();

        if (projects.length === 0 || visibleProjects.length === 0) {
            projectGrid.style.display = 'none';
            if (emptyState) emptyState.style.display = 'block';

            if (projects.length === 0) {
                if (emptyStateTitle) emptyStateTitle.textContent = 'No projects yet';
                if (emptyStateText) emptyStateText.textContent = 'Create your first project to start logging timecodes. Each project is linked to a Google Sheet.';
                if (btnNewProjectEmpty) btnNewProjectEmpty.style.display = 'inline-flex';
            } else {
                if (emptyStateTitle) emptyStateTitle.textContent = 'No matching projects';
                if (emptyStateText) emptyStateText.textContent = 'Try a different keyword for the project name, speaker, or source.';
                if (btnNewProjectEmpty) btnNewProjectEmpty.style.display = 'none';
            }
            return;
        }

        projectGrid.style.display = '';
        if (emptyState) emptyState.style.display = 'none';
        if (btnNewProjectEmpty) btnNewProjectEmpty.style.display = 'inline-flex';

        projectGrid.innerHTML = visibleProjects.map((project, index) => {
            const speakerDisplay = project.speaker || '';
            const sourceDisplay = project.source || '';
            const delay = Math.min(index * 0.08, 0.6);

            return `
                <div class="project-card" style="animation-delay: ${delay}s" data-project-id="${escapeHtml(project.id)}">
                    <div class="project-card-header">
                        <div class="project-card-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </div>
                        <div class="project-card-actions">
                            <a class="card-action-btn" href="${escapeHtml(project.url)}" target="_blank" rel="noopener" title="Open in Google Sheets">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            </a>
                            <button class="card-action-btn danger" data-delete-id="${project.id}" title="Remove project">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="project-card-name">${escapeHtml(project.name)}</div>

                    <div class="project-card-info">
                        <div class="info-row" data-edit-field="speaker" data-edit-id="${escapeHtml(project.id)}">
                            <span class="info-label">Speaker</span>
                            <span class="info-value ${speakerDisplay ? '' : 'empty'}">${speakerDisplay ? escapeHtml(speakerDisplay) : 'Not set'}</span>
                            <span class="info-edit-icon">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </span>
                        </div>
                        <div class="info-row" data-edit-field="source" data-edit-id="${escapeHtml(project.id)}">
                            <span class="info-label">Source</span>
                            <span class="info-value ${sourceDisplay ? '' : 'empty'}">${sourceDisplay ? escapeHtml(sourceDisplay) : 'Not set'}</span>
                            <span class="info-edit-icon">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </span>
                        </div>
                    </div>

                    <div class="project-card-footer">
                        <span class="project-card-date">${formatDate(project.createdAt)}</span>
                        <a href="app.html?sheetId=${encodeURIComponent(project.id)}&sheetName=${encodeURIComponent(project.name)}&sheetUrl=${encodeURIComponent(project.url || '')}" class="btn-open-project">
                            Open Project
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </a>
                    </div>
                </div>
            `;
        }).join('');

        attachCardListeners();
    }

    function attachCardListeners() {
        // Delete buttons
        document.querySelectorAll('[data-delete-id]').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const pId = btn.dataset.deleteId;
                const project = projects.find(p => p.id === pId);
                if (!project) return;

                if (confirm(`Remove "${project.name}" from your project list?\n\n(The Google Sheet file will NOT be deleted from Google Drive)`)) {
                    try {
                        const res = await fetch('/api/projects', {
                            method: 'DELETE',
                            headers: getAuthHeaders(),
                            body: JSON.stringify({ id: pId })
                        });
                        if (!res.ok) throw new Error('Failed to delete project');
                        projects = projects.filter(p => p.id !== pId);
                        renderProjects();
                    } catch (err) {
                        alert('Could not remove project: ' + err.message);
                    }
                }
            });
        });

        // Edit info rows
        document.querySelectorAll('[data-edit-field]').forEach(row => {
            row.addEventListener('click', () => {
                const field = row.dataset.editField;
                const projectId = row.dataset.editId;
                const idx = projects.findIndex(project => project.id === projectId);
                if (isNaN(idx) || idx < 0 || idx >= projects.length) return;
                openEditFieldModal(idx, field);
            });
        });
    }

    // ── Create Project Modal ─────────────────────────────────
    function openNewProjectModal() {
        if (!newProjectModal) return;
        const today = new Date().toISOString().slice(0, 10);
        if (modalProjectName) modalProjectName.value = 'Project_' + today;
        if (modalSpeaker) modalSpeaker.value = '';
        if (modalSource) modalSource.value = '';
        if (modalStatus) { modalStatus.style.display = 'none'; modalStatus.textContent = ''; }
        if (modalCreate) modalCreate.disabled = false;

        newProjectModal.style.display = 'flex';
        if (modalProjectName) modalProjectName.focus();
    }

    function closeNewProjectModal() {
        if (newProjectModal) newProjectModal.style.display = 'none';
    }

    async function handleCreateProject() {
        const projectName = modalProjectName ? modalProjectName.value.trim() : '';
        const speaker = modalSpeaker ? modalSpeaker.value.trim() : '';
        const source = modalSource ? modalSource.value.trim() : '';

        if (!projectName) {
            showModalStatus('Please enter a project name.', 'error');
            return;
        }

        if (modalCreate) modalCreate.disabled = true;
        showModalStatus('Creating Google Sheet clone via Apps Script owner...', 'loading');

        try {
            const res = await fetch('/api/projects', {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({
                    name: projectName,
                    speaker,
                    source
                })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.error || 'Server error');
            }

            // Project created successfully!
            projects.unshift(data);

            if (data.moveStatus === 'failed') {
                showModalStatus(`Created, but failed to move to folder: ${data.moveError}`, 'error');
                setTimeout(() => {
                    closeNewProjectModal();
                    renderProjects();
                }, 6000);
            } else if (data.moveStatus === 'outdated_script') {
                showModalStatus('Created. Warning: Google Apps Script Web App is outdated. Please deploy a "New Version".', 'error');
                setTimeout(() => {
                    closeNewProjectModal();
                    renderProjects();
                }, 6000);
            } else {
                showModalStatus('Project created successfully!', 'success');
                setTimeout(() => {
                    closeNewProjectModal();
                    renderProjects();
                }, 800);
            }

        } catch (err) {
            console.error('[Project] Create error:', err);
            showModalStatus('Error: ' + err.message, 'error');
            if (modalCreate) modalCreate.disabled = false;
        }
    }

    function showModalStatus(msg, type) {
        if (!modalStatus) return;
        modalStatus.style.display = 'flex';
        modalStatus.className = 'modal-status' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');

        if (type === 'loading') {
            modalStatus.innerHTML = `<span class="spinner"></span>${escapeHtml(msg)}`;
        } else {
            modalStatus.textContent = msg;
        }
    }

    // ── Edit Field Modal ─────────────────────────────────────
    function openEditFieldModal(index, field) {
        if (!editFieldModal) return;
        editingProject = { index, field };

        const project = projects[index];
        const isSource = field === 'source';
        const currentValue = isSource ? (project.source || '') : (project.speaker || '');

        if (editFieldTitle) editFieldTitle.textContent = isSource ? 'Edit Source / Link' : 'Edit Speaker';
        if (editFieldLabel) editFieldLabel.textContent = isSource ? 'Source / Link (B2)' : 'Speaker (B1)';
        if (editFieldInput) editFieldInput.value = currentValue;

        editFieldModal.style.display = 'flex';
        if (editFieldInput) editFieldInput.focus();
    }

    function closeEditFieldModal() {
        if (editFieldModal) editFieldModal.style.display = 'none';
        editingProject = null;
    }

    async function handleSaveField() {
        if (!editingProject) return;

        const { index, field } = editingProject;
        const project = projects[index];
        const newValue = editFieldInput ? editFieldInput.value.trim() : '';
        const isSource = field === 'source';

        // Prepare body
        const updateBody = {
            id: project.id,
            speaker: isSource ? project.speaker : newValue,
            source: isSource ? newValue : project.source
        };

        // Optimistically update frontend UI
        if (isSource) {
            project.source = newValue;
        } else {
            project.speaker = newValue;
        }
        renderProjects();
        closeEditFieldModal();

        // Save to backend via proxy
        try {
            const res = await fetch('/api/projects', {
                method: 'PUT',
                headers: getAuthHeaders(),
                body: JSON.stringify(updateBody)
            });
            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.error || 'Failed to update metadata');
            }
        } catch (err) {
            console.error('Update metadata failed:', err);
            alert('Warning: Could not save changes to Sheet. ' + err.message);
            // Refresh to restore original data
            loadProjects();
        }
    }

    // ── Admin: User Management Panel ─────────────────────────
    // ── Logout ───────────────────────────────────────────────
    function handleLogout() {
        localStorage.removeItem('autoscript_session_token');
        localStorage.removeItem('autoscript_session_username');
        window.location.href = 'login.html';
    }

    // ── Event Listeners ──────────────────────────────────────
    if (btnNewProject) btnNewProject.addEventListener('click', openNewProjectModal);
    if (btnNewProjectEmpty) btnNewProjectEmpty.addEventListener('click', openNewProjectModal);
    if (btnLogout) btnLogout.addEventListener('click', handleLogout);
    if (projectSearchInput) {
        projectSearchInput.value = projectSearchQuery;
        projectSearchInput.addEventListener('input', (e) => {
            projectSearchQuery = e.target.value || '';
            renderProjects();
        });
    }
    if (projectSortSelect) {
        projectSortSelect.value = projectSortMode;
        projectSortSelect.addEventListener('change', (e) => {
            setProjectSortMode(e.target.value);
        });
    }
    if (btnGridView) btnGridView.addEventListener('click', () => setProjectViewMode('grid'));
    if (btnListView) btnListView.addEventListener('click', () => setProjectViewMode('list'));
    
    // New project modal
    if (modalClose) modalClose.addEventListener('click', closeNewProjectModal);
    if (modalCancel) modalCancel.addEventListener('click', closeNewProjectModal);
    if (modalCreate) modalCreate.addEventListener('click', handleCreateProject);

    // Edit field modal
    if (editFieldClose) editFieldClose.addEventListener('click', closeEditFieldModal);
    if (editFieldCancel) editFieldCancel.addEventListener('click', closeEditFieldModal);
    if (editFieldSave) editFieldSave.addEventListener('click', handleSaveField);

    // Close modals on overlay click
    [newProjectModal, editFieldModal].forEach(modal => {
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                    if (modal === editFieldModal) editingProject = null;
                }
            });
        }
    });

    // Keyboard shortcuts for modals
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeNewProjectModal();
            closeEditFieldModal();
        }
        if (e.key === 'Enter') {
            if (editFieldModal && editFieldModal.style.display === 'flex') {
                e.preventDefault();
                handleSaveField();
            } else if (newProjectModal && newProjectModal.style.display === 'flex') {
                e.preventDefault();
                handleCreateProject();
            }
        }
    });

    // ── Initialize ───────────────────────────────────────────
    renderUserInfo();
    syncProjectToolbar();
    loadProjects();

})();
</script>
</body>
</html>
